name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No labeled/unlabeled: a label change carries no new commit, so the run it
    # starts tests the same tree the previous one did and is immediately killed
    # by cancel-in-progress below. Dependabot labels every PR it opens, which
    # made that the normal path -- measured 4 cancelled CI runs on every one of
    # the last 7 dependabot PRs. Use workflow_dispatch to re-run on demand.
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  schedule:
    # Nightly full run. The end-to-end lane is changed-path gated on pull
    # requests, so without this a tree that no pull request touched -- a
    # dependency bump landed by merge queue, a provider-side change -- would
    # never be exercised end to end. Off the top of the hour on purpose:
    # GitHub drops scheduled runs it cannot start during the :00 spike.
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  static_analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Enforce repository governance
        run: >-
          docker run --rm --read-only --network none
          --volume "$GITHUB_WORKSPACE:/github/workspace:ro"
          --workdir /github/workspace
          ghcr.io/venturi-systems/repository-governance-validator@sha256:9687a75b75ec9d653a3ede789a6baa05bdc1dd1c2711aac476f7990b15eb1fc7
          --manifest .venturi/repository-governance.json
          --repository "$GITHUB_REPOSITORY"
          --root /github/workspace

      - name: Check fork portability contract
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').packageManager")" = "bun@1.3.7"
          test -f apps/web/Dockerfile
          test -f docker-compose.yml
          test -f .env.example
          grep -q '^DATABASE_URL=' .env.example
          grep -q '^REDIS_URL=' .env.example
          grep -q 'SKIP_ENV_VALIDATION' .github/workflows/ci.yml
          grep -q 'ghcr.io' .github/workflows/docker.yml
          private_operator_email="richard@""venturi.systems"
          if grep -R "$private_operator_email" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.output \
            --exclude='*.lock' \
            --exclude='bun.lock' \
            .; then
            echo "Private operator email leaked into tracked files." >&2
            exit 1
          fi
          # Zero tolerance for the retired predecessor company name, in every tracked
          # file and path, any letter case. It is spelled as hex escapes so this
          # workflow does not carry the name it forbids.
          retired_name=$(printf '%b' '\x61\x72\x67\x6d\x69\x6e')
          if git grep -n -i -I -e "$retired_name" -- . || git ls-files | grep -i -e "$retired_name"; then
            echo "The retired predecessor name appeared in a tracked file or path." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run --filter @quackback/widget build
      - run: bun run --filter @quackback/widget test
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - run: bun run --filter @quackback/web typecheck

  database_tests:
    name: Database migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quackback_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - name: Apply and verify online performance indexes
        run: bun run db:indexes
      - run: bun run test --run

  changed_paths:
    name: Changed-path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The reuse probe below reads workflow runs and jobs, the PR, and commit
    # trees. Read-only, and scoped to this job so the heavy lanes inherit
    # nothing extra.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      # true ONLY when the probe proved this merge-queue entry's git tree is
      # byte-identical to the recorded checkout on which all 8 e2e shards
      # succeeded. Every other outcome -- not a merge_group event, multi-PR
      # group, no successful PR run, any shard not `success`, tree mismatch,
      # any API error -- is false, and the e2e lane runs in full.
      queue_reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # The filter diffs against the pull request's base commit, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - name: Decide whether the end-to-end lane runs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Only a pull request has a base commit to diff against. Every other
          # trigger -- merge_group, push to main, the nightly schedule,
          # workflow_dispatch -- runs the lane in full, and so does any failure
          # to compute the diff. The fail-closed answer here is "run", never
          # "skip": a filter that cannot see the change set must not be able to
          # wave it through.
          if [ "$EVENT_NAME" != pull_request ] || [ -z "$BASE_SHA" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME: running the end-to-end lane with no path filter."
            exit 0
          fi
          if ! changed="$(git diff --name-only "$BASE_SHA" HEAD)"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "Could not diff against $BASE_SHA: running the end-to-end lane."
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(apps/web/|packages/|package\.json$|bun\.lock$|\.github/workflows/ci\.yml$)' >/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse exact-tree PR evidence for a merge-queue entry
        id: reuse
        # Every merge-queue entry re-runs all 8 Playwright shards. For a
        # single-PR entry on an unmoved base that is ~22 minutes on the PR and
        # then the same ~22 minutes again in the queue, on a git tree that is
        # byte-identical. It roughly doubles PR -> main latency and produces no
        # new information. It also doubles the exposure to the wedge that
        # cancelled shard 6 at the 90-minute job cap on run 34102576840 and
        # evicted the queued run behind it.
        #
        # Reuse fires ONLY on positive proof, and every branch that cannot
        # prove equivalence leaves reuse=false so the lane runs in full:
        #   - not a merge_group event (the step does not even run);
        #   - no PR number in the queue ref (multi-PR groups differ by tree
        #     anyway, but this is checked explicitly rather than assumed);
        #   - no successful `pull_request` run of THIS workflow at the PR's
        #     head sha;
        #   - that run's e2e shards are not ALL `success` -- a PR whose
        #     path filter skipped e2e has no e2e evidence to reuse, so its
        #     queue entry still gets the full lane, exactly as today;
        #   - the queue head's git tree differs from the recorded tested merge tree
        #     (base advanced under it);
        #   - any thrown error, including API failures.
        #
        # The equivalence argument: an identical tree with an identical
        # workflow yields an identical seed, identical shard partition and
        # identical assertions. A second run adds no information. Ported
        # from the platform repo's pack-validate.yml exact-tree probe, with
        # the per-shard success requirement added on top.
        if: github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('reuse', 'false');
            core.setOutput('reason', 'no exact-tree evidence');
            try {
              const ref = process.env.GITHUB_WORKFLOW_REF || '';
              const file = ref.split('@')[0].split('/').pop();
              if (!file) throw new Error(`cannot derive workflow file from ${ref}`);
              const mg = context.payload.merge_group;
              const headSha = (mg && mg.head_sha) || context.sha;
              const headRef = (mg && mg.head_ref) || context.ref || '';
              const match = headRef.match(/\/pr-(\d+)-/);
              if (!match) throw new Error(`no pull request number in queue ref ${headRef}`);
              const prNumber = Number(match[1]);
              const { owner, repo } = context.repo;
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const prHeadSha = pr.data.head.sha;
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id: file, event: 'pull_request',
                  head_sha: prHeadSha, status: 'success', per_page: 100 }
              );
              const successful = runs.find(r =>
                r.head_sha === prHeadSha && r.conclusion === 'success');
              if (!successful) {
                core.setOutput('reason', `PR #${prNumber} head ${prHeadSha} has no successful ${file} run`);
                core.info('full run required: no successful PR-lane run');
                return;
              }
              // Positive proof that the e2e lane itself ran and passed on
              // that head. A green run whose e2e was path-filtered off has
              // nothing to reuse.
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: successful.id, per_page: 100 }
              );
              const shards = jobs.filter(j => /^End-to-end tests \(shard \d+ of 8\)$/.test(j.name));
              const green = shards.filter(j => j.status === 'completed' && j.conclusion === 'success');
              if (shards.length !== 8 || green.length !== 8 || new Set(shards.map(j => j.name)).size !== 8) {
                core.setOutput('reason', `PR run ${successful.id} has ${green.length}/${shards.length} successful e2e shards (need 8/8)`);
                core.info('full run required: e2e evidence incomplete on the PR lane');
                return;
              }
              const requiredSteps = [
                'Checkout tested source', 'Record the actual tested checkout',
                'Collect the expected tests for this shard', 'Run the Playwright suite',
                'Check the shard against the known-failure ratchet',
                'Verify the tested checkout is unchanged', 'Upload tested checkout evidence',
              ];
              if (!shards.every(job => requiredSteps.every(name => {
                const steps = (job.steps || []).filter(step => step.name === name);
                return steps.length === 1 && steps[0].status === 'completed' &&
                  steps[0].conclusion === 'success';
              }))) throw new Error('required shard steps did not execute successfully');
              // The PR jobs check out GitHub's synthetic merge, not prHeadSha.
              // Each successful shard uploads the commit/tree captured immediately
              // after checkout. Require all eight immutable, digest-verified receipts.
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: successful.id, per_page: 100 }
              );
              const prefix = `e2e-tested-tree-${successful.id}-${successful.run_attempt}-`;
              const evidence = artifacts.filter(a => a.name.startsWith(prefix));
              if (evidence.length !== 8) throw new Error('missing or duplicate shard evidence');
              const fs = require('node:fs');
              const os = require('node:os');
              const path = require('node:path');
              const crypto = require('node:crypto');
              const { execFileSync } = require('node:child_process');
              const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'e2e-evidence-'));
              const receipts = [];
              try {
                for (let shard = 1; shard <= 8; shard++) {
                  const matches = evidence.filter(a => a.name === prefix + shard);
                  if (matches.length !== 1 || matches[0].expired || matches[0].size_in_bytes > 65536) throw new Error('invalid shard evidence');
                  const artifact = matches[0];
                  if (artifact.workflow_run?.id !== successful.id ||
                      artifact.workflow_run?.head_sha !== prHeadSha ||
                      !/^sha256:[0-9a-f]{64}$/.test(artifact.digest || '')) {
                    throw new Error('unbound artifact metadata');
                  }
                  const download = await github.rest.actions.downloadArtifact({
                    owner, repo, artifact_id: artifact.id, archive_format: 'zip'
                  });
                  const bytes = Buffer.from(download.data);
                  const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
                  if (digest !== artifact.digest) throw new Error('artifact digest mismatch');
                  const archive = path.join(tmp, `shard-${shard}.zip`);
                  fs.writeFileSync(archive, bytes);
                  const receipt = JSON.parse(execFileSync('unzip', ['-p', archive, 'tested-tree.json'], {
                    encoding: 'utf8', maxBuffer: 65536
                  }));
                  if (receipt.schema !== 1 || receipt.run_id !== successful.id ||
                      receipt.run_attempt !== successful.run_attempt || receipt.shard !== shard ||
                      receipt.pr_head !== prHeadSha || receipt.event !== 'pull_request' ||
                      !/^[0-9a-f]{40}$/.test(receipt.commit || '') ||
                      !/^[0-9a-f]{40}$/.test(receipt.tree || '')) {
                    throw new Error('malformed or mismatched tested-tree receipt');
                  }
                  receipts.push(receipt);
                }
              } finally {
                fs.rmSync(tmp, { recursive: true, force: true });
              }
              const first = receipts[0];
              if (!receipts.every(r => r.commit === first.commit && r.tree === first.tree)) {
                throw new Error('shards tested different checkouts');
              }
              const [queueCommit, testedCommit] = await Promise.all([
                github.rest.repos.getCommit({ owner, repo, ref: headSha }),
                github.rest.repos.getCommit({ owner, repo, ref: first.commit }),
              ]);
              if (testedCommit.data.commit.tree.sha !== first.tree ||
                  !testedCommit.data.parents.some(p => p.sha === prHeadSha) ||
                  queueCommit.data.commit.tree.sha !== first.tree) {
                core.setOutput('reason', 'queue tree differs from verified tested PR merge tree');
                core.info('full run required: tree mismatch');
                return;
              }
              core.setOutput('reuse', 'true');
              core.setOutput('reason', `queue tree ${first.tree} equals tested PR merge ${first.commit}; 8/8 e2e shards succeeded in run ${successful.id} attempt ${successful.run_attempt}`);
              core.info('reusing exact-tree PR e2e evidence');
            } catch (error) {
              core.setOutput('reason', `evidence lookup failed: ${error.message}`);
              core.info(`full run required (fail-closed): ${error.message}`);
            }

  e2e_tests:
    name: End-to-end tests (shard ${{ matrix.shard }} of 8)
    needs: [changed_paths]
    # Runs unless the path filter says nothing e2e-relevant moved, OR the
    # merge-queue probe proved this exact tree already passed all 8 shards
    # on its PR. Both are positive decisions by changed_paths; a failed or
    # skipped changed_paths leaves e2e unset and this job does not run --
    # which portability_gate then treats as a failure, never a pass.
    if: needs.changed_paths.outputs.e2e == 'true' && needs.changed_paths.outputs.queue_reuse != 'true'
    runs-on: ubuntu-latest
    # A cancelled shard reports NOTHING -- no counts, no failure list -- so the
    # cap has to be comfortably above the slowest honest run, and the run has to
    # be short enough that it is.
    #
    # Run 33659964879 (4 shards, 45 min): shard 2 cancelled at 44m55s, ~197
    # tests unmeasured. Raising to 90 fixed that shard -- it reported in 20.7m.
    # Run 33665960056 (4 shards, 90 min): shard 3 then cancelled at 90m, having
    # reached test 129 of 209. It was not hanging. It got SLOWER because it got
    # more honest: fixing the beforeAll budgets means the 70 tests it previously
    # reported as "did not run" now actually execute, and `retries: 2` makes
    # every failing one cost three attempts.
    #
    # So raising the cap a third time is chasing the symptom. Splitting 8 ways
    # instead halves each shard's wall time without touching `retries`,
    # `workers: 1` (which this suite needs -- one seeded tenant, one demo
    # account, no cross-test isolation), or a single assertion.
    timeout-minutes: 90
    strategy:
      # One shard's failure must not hide the others: the first complete signal
      # for this suite is still being assembled.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quackback_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # config.ts requires REDIS_URL: the server refuses to boot without a
        # reachable queue backend. Plain Redis stands in for the Dragonfly of
        # docker-compose.yml; the Dragonfly-only flags there exist to make
        # Dragonfly behave like this.
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-for-ci-only-must-be-at-least-32-characters
      REDIS_URL: redis://localhost:6379
      # Duration-balanced shard boundaries.
      #
      # `--shard=i/8` splits by test COUNT, not duration: filterForShard sums
      # group.tests.length and cuts at equal counts. Test durations here span
      # three orders of magnitude, so equal counts produce very unequal work.
      # Measured on run 35289540093, the eight shards ran 6.5, 6.5, 8.0, 9.2,
      # 10.2, 10.5, 10.5 and 12.8 minutes. The slowest sets the critical path
      # and the fastest finishes five minutes early holding an idle runner.
      #
      # PWTEST_SHARD_WEIGHTS moves the cut points. Each weight is that shard's
      # share of the total test count, so a shard full of slow tests is given
      # fewer of them. The numbers below were derived from the measured
      # per-test durations of that run: walk the tests in Playwright's own
      # order, cut when cumulative duration crosses the next eighth. They sum
      # to 803, the current test count, which makes the split exact rather
      # than rounded -- but nothing depends on that, because Playwright uses
      # the weights proportionally.
      #
      # Regenerate after a significant change in the suite's shape:
      #   bun apps/web/e2e/scripts/compute-shard-weights.ts <results...>
      #
      # Why this does not change coverage: filterForShard assigns every group
      # to exactly one shard for ANY weight vector -- it only moves the
      # boundaries between them. Verified rather than assumed: the union of
      # all eight shards is byte-identical with and without these weights
      # (803 distinct tests either way). See tests/ci-contract.test.ts.
      #
      # This is set at JOB level on purpose. The plan step and the run step
      # must see the same value; if only one did, the shard's results would
      # not match its own plan and check-known-failures.ts would fail it.
      #
      # Failure modes are all safe. A Playwright version that ignores the
      # variable reverts to equal-count splitting, which is today's behavior.
      # One that rejects it fails loudly in CI. Weights that drift as tests
      # are added degrade toward that same equal-count baseline; they cannot
      # drop a test.
      PWTEST_SHARD_WEIGHTS: '124:80:157:78:80:92:89:103'
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Record the actual tested checkout
        env:
          SHARD: ${{ matrix.shard }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          evidence = {
              'schema': 1,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'shard': int(os.environ['SHARD']),
              'event': os.environ['GITHUB_EVENT_NAME'],
              'pr_head': os.environ['PR_HEAD'],
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'e2e-evidence'
          target.mkdir()
          (target / 'tested-tree.json').write_text(json.dumps(evidence) + '\n')
          PYTHON
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Resolve the seeded tenant subdomain to loopback
        # playwright.config.ts drives the suite at http://acme.localhost:3000
        # (subdomain tenancy). Chromium resolves *.localhost itself, but the
        # Node side does not: the webServer readiness probe and the dotenv-cli
        # database helpers go through getaddrinfo.
        run: echo '127.0.0.1 acme.localhost' | sudo tee -a /etc/hosts

      - name: Write the .env the dev server and the e2e helpers read
        # Workflow-level env is not enough. apps/web `dev` runs
        # `bun --env-file=../../.env vite dev`, and e2e/utils/db-helpers.ts
        # shells out through `dotenv -e ../../.env`; both read this file.
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          BASE_URL=$BASE_URL
          TRUSTED_ORIGINS=http://acme.localhost:3000
          PORT=3000
          SECRET_KEY=$SECRET_KEY
          REDIS_URL=$REDIS_URL
          EOF

      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed

      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Collect the expected tests for this shard
        working-directory: apps/web
        # Collect independently before execution: a partial JSON report must
        # not be able to certify its own completeness from a minimum count.
        run: bunx playwright test --list --reporter=json --shard=${{ matrix.shard }}/8 > e2e-plan.json

      - name: Run the Playwright suite
        working-directory: apps/web
        # playwright.config.ts starts the dev server itself (webServer) and,
        # because CI is set, forbids test.only, retries twice and uses one
        # worker per shard.
        #
        # `|| true` on purpose: the NEXT step is the gate. Playwright exits
        # non-zero for a failure that is already on e2e/known-failures.json,
        # and that must not redden the shard while the entry stands. Everything
        # a swallowed exit code could hide -- a missing or truncated report, a
        # web server that never came up, a failure not on the list, a listed
        # test that started passing -- is checked explicitly there, fail-closed.
        run: bun run test:e2e -- --shard=${{ matrix.shard }}/8 || true

      - name: Check the shard against the known-failure ratchet
        working-directory: apps/web
        run: bun e2e/scripts/check-known-failures.ts e2e-results.json e2e/known-failures.json e2e-plan.json

      - name: Verify the tested checkout is unchanged
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'e2e-evidence' / 'tested-tree.json'
          evidence = json.loads(target.read_text())
          for field, ref in [('commit', 'HEAD'), ('tree', 'HEAD^{tree}')]:
              actual = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
              if actual != evidence[field]:
                  raise SystemExit('Tested checkout changed after evidence capture')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          PYTHON

      - name: Upload tested checkout evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tested-tree-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-evidence/tested-tree.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload the Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            apps/web/blob-report
            apps/web/test-results
            apps/web/e2e-results.json
            apps/web/e2e-plan.json
          retention-days: 7
          if-no-files-found: ignore

  portability_gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'portability-gate (manual diagnostic)' || 'portability-gate' }}
    if: ${{ always() }}
    needs: [static_analysis, database_tests, changed_paths, e2e_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every independent lane
        env:
          STATIC_RESULT: ${{ needs.static_analysis.result }}
          DATABASE_RESULT: ${{ needs.database_tests.result }}
          CHANGED_PATHS_RESULT: ${{ needs.changed_paths.result }}
          E2E_RESULT: ${{ needs.e2e_tests.result }}
          E2E_FILTER: ${{ needs.changed_paths.outputs.e2e }}
          QUEUE_REUSE: ${{ needs.changed_paths.outputs.queue_reuse }}
        run: |
          test "$STATIC_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$CHANGED_PATHS_RESULT" = success
          # Static analysis and the database lane run on EVERY event, merge
          # queue included -- they are cheap and act as belt-and-braces on
          # the exact tree even when e2e evidence is reused.
          #
          # An e2e `skipped` is accepted for exactly two reasons, each a
          # positive decision recorded by changed_paths (required to have
          # SUCCEEDED above):
          #   1. the path filter reported nothing under the e2e surface moved;
          #   2. the merge-queue probe proved this tree already passed all 8
          #      shards on its PR.
          # A skip for any other reason -- an upstream failure, a cancelled
          # changed_paths, an unset output -- still reds the gate. Failure
          # and cancellation always do.
          if [ "$E2E_RESULT" = success ]; then
            exit 0
          fi
          if [ "$E2E_RESULT" = skipped ] && [ "$E2E_FILTER" = false ]; then
            echo "e2e skipped: path filter found no e2e-relevant change."
            exit 0
          fi
          if [ "$E2E_RESULT" = skipped ] && [ "$QUEUE_REUSE" = true ]; then
            echo "e2e skipped: exact-tree PR evidence reused for this merge-queue entry."
            exit 0
          fi
          echo "e2e result '$E2E_RESULT' is not acceptable (filter=$E2E_FILTER reuse=$QUEUE_REUSE)." >&2
          exit 1
