name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  portability-gate:
    name: portability-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Enforce repository governance
        uses: venturi-systems/.github/.github/actions/repository-governance@0d21e9b9a9bcf3e3dba86cc7b0ed9a778af273d9

      - name: Check fork portability contract
        run: |
          set -euo pipefail

          test "$(node -p "require('./package.json').packageManager")" = "bun@1.3.7"
          test -f apps/web/Dockerfile
          test -f docker-compose.yml
          test -f .env.example

          grep -q '^DATABASE_URL=' .env.example
          grep -q '^REDIS_URL=' .env.example
          grep -q 'SKIP_ENV_VALIDATION' .github/workflows/ci.yml
          grep -q 'ghcr.io' .github/workflows/docker.yml

          private_operator_email="richard@""venturi.systems"
          if grep -R "$private_operator_email" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.output \
            --exclude='*.lock' \
            --exclude='bun.lock' \
            .; then
            echo "Private operator email leaked into tracked files." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Build the widget bundle first — apps/web imports
      # packages/widget/dist/browser.js via Vite ?raw, so it must exist
      # before the web build runs.
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - run: bun run --filter @quackback/web typecheck
      - run: bun run db:migrate
      - run: bun run test --run
