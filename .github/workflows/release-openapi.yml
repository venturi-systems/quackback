name: Release OpenAPI Spec

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach openapi.json to (e.g. v0.3.6)'
        required: false
      dry_run:
        description: 'Generate and validate without uploading a release asset'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-openapi-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish-openapi:
    if: >-
      github.repository == 'venturi-systems/quackback' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "venturi-systems/quackback"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$DRY_RUN" != "true" ]; then
              echo "An existing release tag is required for upload" >&2
              exit 1
            fi
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "OpenAPI release identity must be a SemVer v* tag" >&2
            exit 1
          }
          release_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$release_ref" || { echo "$release_ref does not exist" >&2; exit 1; }
          source_sha="$(git rev-parse "$release_ref^{commit}")"
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main || {
            echo "$release_ref is not reachable from protected main" >&2
            exit 1
          }
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (v2.2.0)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: |
          cat << 'EOF' > generate-openapi.ts
          import { writeFileSync } from 'node:fs';
          import { generateOpenAPISpec } from './apps/web/src/lib/server/domains/api/openapi';
          import './apps/web/src/lib/server/domains/api/schemas';

          const spec = generateOpenAPISpec();
          writeFileSync('openapi.json', JSON.stringify(spec, null, 2));
          console.log('OpenAPI spec generated as openapi.json');
          EOF
          bun run generate-openapi.ts

      - name: Validate generated OpenAPI artifact
        run: bun -e "const spec = await Bun.file('openapi.json').json(); if (!spec.openapi || !spec.info) process.exit(1)"

      - name: Stage generated OpenAPI artifact
        if: github.event_name == 'release' || inputs.dry_run == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-release-candidate
          path: openapi.json
          if-no-files-found: error
          retention-days: 1

  upload-release:
    if: >-
      github.repository == 'venturi-systems/quackback' &&
      (github.event_name == 'release' || inputs.dry_run == false)
    needs: publish-openapi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-assets
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-release-candidate
      - name: Refuse to replace an existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-openapi.outputs.release_tag }}
        run: |
          set -euo pipefail
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '[.assets[] | select(.name == "openapi.json")] | length')"
          if [ "$existing" -ne 0 ]; then
            echo "openapi.json already exists on $RELEASE_TAG; release assets are immutable" >&2
            exit 1
          fi
      - name: Upload Release Asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2 (v2.6.2)
        with:
          tag_name: ${{ needs.publish-openapi.outputs.release_tag }}
          files: openapi.json
