name: Audit pre-PR gates

on:
  push:
    branches: [codex/quackback-value-audit-20260906]

permissions:
  contents: read

concurrency:
  group: audit-pre-pr-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  test:
    name: Required bun run test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quackback_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source and dependency contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').packageManager")" = "bun@1.3.7"
          sha256sum bun.lock package.json apps/web/package.json packages/*/package.json scripts/import/package.json > "$RUNNER_TEMP/dependency-inputs.sha256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:indexes
      - run: bun run test
      - name: Verify unchanged dependency inputs
        if: ${{ !cancelled() }}
        run: sha256sum --check "$RUNNER_TEMP/dependency-inputs.sha256"

  lint:
    name: Required bun run lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source and dependency contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').packageManager")" = "bun@1.3.7"
          sha256sum bun.lock package.json apps/web/package.json packages/*/package.json scripts/import/package.json > "$RUNNER_TEMP/dependency-inputs.sha256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Verify unchanged dependency inputs
        if: ${{ !cancelled() }}
        run: sha256sum --check "$RUNNER_TEMP/dependency-inputs.sha256"

  typecheck:
    name: Required bun run typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source and dependency contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').packageManager")" = "bun@1.3.7"
          sha256sum bun.lock package.json apps/web/package.json packages/*/package.json scripts/import/package.json > "$RUNNER_TEMP/dependency-inputs.sha256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - name: Generate application build inputs as in existing CI
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - run: bun run typecheck
      - name: Verify unchanged dependency inputs
        if: ${{ !cancelled() }}
        run: sha256sum --check "$RUNNER_TEMP/dependency-inputs.sha256"
