name: Export amd64 image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA reachable from protected main.'
        required: true
      image_tag:
        description: 'Local image tag embedded in the exported archive.'
        required: false
        default: 'deploy'

permissions:
  contents: read

concurrency:
  group: export-amd64-image-${{ github.event.inputs.sha }}
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'venturi-systems/quackback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable source
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "venturi-systems/quackback"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lowercase commit SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$INPUT_SHA"
          git merge-base --is-ancestor "$INPUT_SHA" refs/remotes/origin/main || {
            echo "source $INPUT_SHA is not reachable from protected main" >&2
            exit 1
          }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # SOURCE_COMMIT gives the portal footer its exact AGPL source link; it and
      # the other build args become the image's OCI labels, which otherwise
      # describe the Bun base image. Same values as the GHCR workflow.
      - name: Build amd64 image archive
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          tag="venturi-feedback-quackback:${IMAGE_TAG}"
          source_created="$(git show -s --format=%cI "$INPUT_SHA")"
          docker buildx build \
            --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --build-arg "SOURCE_COMMIT=${INPUT_SHA}" \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "IMAGE_VERSION=sha-${INPUT_SHA:0:7}" \
            --build-arg "SOURCE_CREATED=${source_created}" \
            --tag "$tag" \
            --output type=docker,dest=/tmp/quackback-amd64.tar \
            .
          gzip -1 /tmp/quackback-amd64.tar
          sha256sum /tmp/quackback-amd64.tar.gz > /tmp/quackback-amd64.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quackback-amd64-image
          path: |
            /tmp/quackback-amd64.tar.gz
            /tmp/quackback-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
