name: Export amd64 image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA or ref to build."
        required: true
      image_tag:
        description: "Local image tag embedded in the exported archive."
        required: false
        default: "deploy"

permissions:
  contents: read

concurrency:
  group: export-amd64-image-${{ github.event.inputs.sha }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.inputs.sha }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build amd64 image archive
        run: |
          set -euo pipefail
          tag="venturi-feedback-quackback:${{ github.event.inputs.image_tag }}"
          docker buildx build \
            --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --tag "$tag" \
            --output type=docker,dest=/tmp/quackback-amd64.tar \
            .
          gzip -1 /tmp/quackback-amd64.tar
          sha256sum /tmp/quackback-amd64.tar.gz > /tmp/quackback-amd64.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quackback-amd64-image
          path: |
            /tmp/quackback-amd64.tar.gz
            /tmp/quackback-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
