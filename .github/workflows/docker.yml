name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA reachable from protected main."
        required: true
      image_tag:
        description: 'Existing v* tag version (for example 0.10.5) bound to sha. Leave blank for sha-<short>.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.inputs.sha || github.sha }}-${{ github.event.inputs.image_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-source:
    if: >-
      github.repository == 'venturi-systems/quackback' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tag: ${{ steps.source.outputs.source_tag }}
      requested_tag: ${{ steps.source.outputs.requested_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind event, source commit, and requested image tag
        id: source
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "venturi-systems/quackback"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "sha must be a full lowercase 40-character commit SHA" >&2
              exit 1
            }
            git cat-file -e "$INPUT_SHA^{commit}"
            source_sha="$(git rev-parse "$INPUT_SHA^{commit}")"
          else
            source_sha="$(git rev-parse "$EVENT_SHA^{commit}")"
          fi

          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main || {
            echo "source $source_sha is not reachable from protected main" >&2
            exit 1
          }

          requested_tag=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_IMAGE_TAG" ]; then
            [[ "$INPUT_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "image_tag must be a SemVer value backed by an existing v* tag" >&2
              exit 1
            }
            release_ref="refs/tags/v${INPUT_IMAGE_TAG}"
            git show-ref --verify --quiet "$release_ref" || {
              echo "release tag $release_ref does not exist" >&2
              exit 1
            }
            tag_sha="$(git rev-parse "$release_ref^{commit}")"
            test "$tag_sha" = "$source_sha" || {
              echo "$release_ref points to $tag_sha, not requested source $source_sha" >&2
              exit 1
            }
            requested_tag="$INPUT_IMAGE_TAG"
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "release ref must be a SemVer v* tag" >&2
              exit 1
            }
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$source_sha"
          fi

          {
            echo "source_sha=$source_sha"
            echo "source_tag=sha-${source_sha:0:7}"
            echo "requested_tag=$requested_tag"
          } >> "$GITHUB_OUTPUT"

  # Build each architecture on its OWN native runner — free arm64 hosted
  # runners (ubuntu-24.04-arm) are GA for public repos — in parallel, pushing
  # each as an untagged per-arch image BY DIGEST. Native beats QEMU here: the
  # image runs `bun install` plus two Vite/TanStack production builds, which are
  # far too slow under arm64 emulation (and risk job timeouts).
  build:
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: container-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve lowercase image ref
        run: echo "IMAGE=${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          # No tags here — the manifest list (and its tags) is assembled in the
          # merge job; each leg pushes an untagged per-arch image by digest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope so the two runners don't clobber each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch manifest list (OCI image index) from the per-arch
  # digests, apply the real tags, then keyless-sign the index digest.
  merge:
    runs-on: ubuntu-latest
    needs: [resolve-source, build]
    timeout-minutes: 20
    environment: container-publish
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve lowercase image ref
        run: echo "IMAGE=${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,priority=600,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}},priority=900,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,priority=700,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.resolve-source.outputs.requested_tag }},priority=900,enable=${{ github.event_name == 'workflow_dispatch' && needs.resolve-source.outputs.requested_tag != '' }}
            type=raw,value=${{ needs.resolve-source.outputs.source_tag }},priority=100

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do tag_args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid digest artifact: $digest" >&2; exit 1; }
            sources+=("${IMAGE}@sha256:${digest}")
          done
          (( ${#tag_args[@]} > 0 && ${#sources[@]} > 0 ))
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Capture image index digest
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless cosign signature over the pushed index digest, required by the
      # cluster's Kyverno verify-images ClusterPolicy (keyless, GitHub OIDC
      # issuer + QuackbackIO workflow subject). --recursive signs the OCI index
      # AND each per-arch child manifest, so policy can verify either the index
      # or a resolved per-arch digest.
      - name: Sign image index (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${IMAGE_DIGEST}"
