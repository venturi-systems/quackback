name: Publish @quackback/widget
on:
  push:
    tags: ['widget-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing widget-v* tag to validate or publish'
        required: false
        type: string
      dry_run:
        description: 'Build and pack without publishing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-widget-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'venturi-systems/quackback' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release source
        id: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "venturi-systems/quackback"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$DRY_RUN" != "true" ]; then
              echo "A widget-v* tag is required for publishing" >&2
              exit 1
            fi
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^widget-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release identity must be a SemVer widget-v* tag" >&2
            exit 1
          }
          release_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$release_ref" || { echo "$release_ref does not exist" >&2; exit 1; }
          source_sha="$(git rev-parse "$release_ref^{commit}")"
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main || {
            echo "$release_ref is not reachable from protected main" >&2
            exit 1
          }
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (v2.2.0)
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            tag_version="${RELEASE_TAG#widget-v}"
            package_version="$(bun -e "console.log(require('./packages/widget/package.json').version)")"
            test "$tag_version" = "$package_version"
          elif [ "$DRY_RUN" != "true" ]; then
            echo "An untagged run must remain a dry run" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget test
      - run: bun run --filter @quackback/widget typecheck
      - run: bun run --filter @quackback/widget build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm >= 11.5.1; Node 22 ships with npm 10.x.
      # Pinned because `npm install -g npm@latest` has hit broken self-upgrade
      # chains (missing transitive deps like promise-retry).
      - run: npm install -g npm@11.5.1
      # No NODE_AUTH_TOKEN — OIDC replaces the token; npmjs.com must have a
      # trusted publisher configured for this repo + workflow.
      - name: Validate package dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cd packages/widget && npm pack --dry-run
      - name: Package release candidate
        if: github.event_name == 'push' || inputs.dry_run == false
        run: mkdir -p dist-release && cd packages/widget && npm pack --pack-destination ../../dist-release
      - name: Upload release candidate
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: widget-release-candidate
          path: dist-release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.repository == 'venturi-systems/quackback' && (github.event_name == 'push' || inputs.dry_run == false)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: widget-release-candidate
          path: dist-release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.5.1
      - run: npm publish dist-release/*.tgz --provenance --access public
