# Dependabot version updates for the quackback monorepo (bun workspace).
# The workspace entry uses the `bun` ecosystem so each update carries the
# matching `bun.lock`; Docker covers the two real image directories;
# github-actions covers SHA-pinned workflow actions.

version: 2
updates:
  # 2026-08-27: this entry was `package-ecosystem: "npm"` and every pull request
  # it opened failed CI at the first step. `portability-gate` is the repository's
  # ONLY required status context and it runs `bun install --frozen-lockfile`
  # (.github/workflows/ci.yml), while `packageManager` is pinned to `bun@1.3.7`.
  # The npm ecosystem edits `package.json` and `package-lock.json` and never
  # writes `bun.lock`, so the install aborts before lint, build, typecheck or
  # tests ever run:
  #   error: lockfile had changes, but lockfile is frozen
  # Measured on run 32996099490 (#56, bullmq) and reproduced identically on #54
  # (ioredis) and #55 (@tanstack/react-table) -- three unrelated bumps, one
  # shared cause, 100% of npm dependency pull requests blocked.
  #
  # The header of this file used to assert that "the bun lockfile is regenerated
  # by CI/humans on merge". No workflow does that and no required check would
  # pass long enough to reach a merge, so it described a process that was never
  # built. The `bun` ecosystem updates `bun.lock` alongside the manifest, which
  # makes the frozen-lockfile check pass on the pull request itself rather than
  # depending on a repair step that does not exist.
  #
  # `directory: "/"`, not the `directories: ["/**"]` glob the npm entry carried:
  # in a bun workspace the ROOT manifest resolves its members and the single
  # root `bun.lock` is the only lockfile in the tree, so the root entry already
  # covers every workspace package. That is the same resolution fact #57 relied
  # on to collapse the duplicate npm pull requests, applied to the one lockfile
  # that actually exists.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Minor and patch only. A grouped PR is all-or-nothing, so ONE breaking
      # major takes down every other update riding with it -- #36 lost 22
      # updates to a single typescript major, and the 2026-08-26 group lost 4
      # to `@tanstack/react-table` 8 -> 9 (removed the `useReactTable` export)
      # and `bullmq` 5 -> 6 arriving together.
      #
      # Majors still flow, as their own individual PRs, where the migration
      # they need can be written and reviewed on its own. That is the whole
      # difference: a major is a code change, and a group is for updates that
      # are not.
      workspace-bun:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # @typescript-eslint 8.x cannot parse TypeScript 7. Its published peer
      # range is `typescript: ">=4.8.4 <6.1.0"` as of 8.68.0, and on TS 7
      # `bun run lint` does not report findings -- it CRASHES:
      #   TypeError: Cannot read properties of undefined (reading 'Cjs')
      #     at @typescript-eslint/typescript-estree@8.58.2/create-program/shared.js:59
      # That took the whole workspace group down in #36 (22 updates) even
      # after the lockfile was regenerated, because one member poisons the group.
      #
      # Minor and patch TypeScript updates still flow. LIFT THIS when
      # `npm view typescript-eslint peerDependencies` shows a range admitting
      # >=7 -- then let the group carry both in one PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # There is no Dockerfile at the repo root. Pointing this entry at "/" made every
  # weekly run fail with `dependency_file_not_found: No Dockerfiles nor Kubernetes
  # YAML found in /`, so the two base images below were never scanned for updates
  # at all. List the directories that actually hold a Dockerfile.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # 2026-08-26: one globbed entry per ecosystem replaces the previous narrow
  # per-directory entries. Dependabot rejects overlapping (ecosystem, directory)
  # pairs, and a glob also covers module dirs added later without maintenance.
  - package-ecosystem: "docker"
    directories: ["/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      docker-all:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"
