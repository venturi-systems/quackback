# Dependabot version updates for the quackback monorepo (bun workspace).
# npm ecosystem entries cover package.json ranges in every workspace directory;
# the bun lockfile is regenerated by CI/humans on merge. Docker covers the
# root images; github-actions covers SHA-pinned workflow actions.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
      - "/packages/db"
      - "/packages/email"
      - "/packages/ids"
      - "/packages/logger"
      - "/packages/widget"
      - "/scripts/import"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      workspace-npm:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
