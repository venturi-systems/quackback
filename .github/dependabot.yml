# Dependabot version updates for the quackback monorepo (bun workspace).
# npm ecosystem entries cover package.json ranges in every workspace directory;
# the bun lockfile is regenerated by CI/humans on merge. Docker covers the two
# real image directories; github-actions covers SHA-pinned workflow actions.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
      - "/packages/db"
      - "/packages/email"
      - "/packages/ids"
      - "/packages/logger"
      - "/packages/widget"
      - "/scripts/import"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Minor and patch only. A grouped PR is all-or-nothing, so ONE breaking
      # major takes down every other update riding with it -- #36 lost 22
      # updates to a single typescript major, and the 2026-08-26 group lost 4
      # to `@tanstack/react-table` 8 -> 9 (removed the `useReactTable` export)
      # and `bullmq` 5 -> 6 arriving together.
      #
      # Majors still flow, as their own individual PRs, where the migration
      # they need can be written and reviewed on its own. That is the whole
      # difference: a major is a code change, and a group is for updates that
      # are not.
      workspace-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # @typescript-eslint 8.x cannot parse TypeScript 7. Its published peer
      # range is `typescript: ">=4.8.4 <6.1.0"` as of 8.68.0, and on TS 7
      # `bun run lint` does not report findings -- it CRASHES:
      #   TypeError: Cannot read properties of undefined (reading 'Cjs')
      #     at @typescript-eslint/typescript-estree@8.58.2/create-program/shared.js:59
      # That took the whole workspace-npm group down in #36 (22 updates) even
      # after the lockfile was regenerated, because one member poisons the group.
      #
      # Minor and patch TypeScript updates still flow. LIFT THIS when
      # `npm view typescript-eslint peerDependencies` shows a range admitting
      # >=7 -- then let the group carry both in one PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # There is no Dockerfile at the repo root. Pointing this entry at "/" made every
  # weekly run fail with `dependency_file_not_found: No Dockerfiles nor Kubernetes
  # YAML found in /`, so the two base images below were never scanned for updates
  # at all. List the directories that actually hold a Dockerfile.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # 2026-08-26: one globbed entry per ecosystem replaces the previous narrow
  # per-directory entries. Dependabot rejects overlapping (ecosystem, directory)
  # pairs, and a glob also covers module dirs added later without maintenance.
  - package-ecosystem: "docker"
    directories: ["/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      docker-all:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"
